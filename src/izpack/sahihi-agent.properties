# Sahihi signing agent: settings for this computer.
#
# The agent reads this file from its install directory when it starts; restart
# it after a change. Values here override the defaults built into the agent.

# The web origins (scheme://host[:port], comma-separated) allowed to call the
# agent. Every other origin is refused before any dialog opens. "*" is not
# accepted. For the PoC demo: the PoC's Sahihi, and the dev server.
cors_allowed_origin=https://sahihi.foxhound.co.ke, http://localhost:8000


# Only offer certificates issued by exactly this distinguished name: copy the
# "Issuer:" line that `certutil -user -store My` prints for the signer's
# certificate. Empty offers every certificate in the Windows store with
# nonRepudiation; Sahihi checks the chain itself either way.
certificate_issuer=
